<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Spider Pet — 空间测试页</title>
  <style>
    body { margin: 0; font: 17px/1.8 system-ui, sans-serif; background: #0c111a; color: #bfcce0; }
    main { max-width: 850px; margin: auto; padding: 100px 32px; }
    h1, h2 { color: #e5ecf9; }
    section { background: #101a28; padding: 32px; border-radius: 12px; margin: 28px 0; }
    a { display: inline-block; color: #8caaff; padding: 6px 10px; margin: 10px; border: 1px solid #26364f; border-radius: 4px; }
    .spacer { height: 650px; border-left: 2px dashed #bddbd7; margin: 40px; padding-left: 20px; }
    .scrollbox { height: 160px; overflow: auto; border: 1px solid #bddbd7; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Web Spider Pet 空间测试</h1>
    <p>请在独立 Chrome 打开此页，点击右上角 W →“开始探索”。线框蜘蛛会依次爬向可见链接，走完即停，不会打开它们。</p>
    <section>
      <a id="first" href="https://example.com/">目标 A：Example</a>
      <a id="second" href="https://developer.chrome.com/">目标 B：Chrome 文档</a>
      <a href="#lower">目标 C：页内锚点</a>
      <a class="hidden" href="https://example.com/hidden">隐藏链接，不应成为目标</a>
      <a href="mailto:test@example.com">邮件链接，不应成为目标</a>
    </section>
    <p>八条腿的动作来自实际移动，链接框来自真实网页位置。只想走一步，可以选择“只走一个链接”；“停止”会立即结束本轮。</p>
    <section class="scrollbox">
      <a href="https://example.com/nested">内层滚动容器里的链接</a>
      <div style="height: 250px"></div>
      <a href="https://example.com/nested-bottom">内层底部链接</a>
    </section>
    <div class="spacer">向下滚动，发现另一组真实链接。</div>
    <section id="lower">
      <h2>另一片网页空间</h2>
      <a href="https://vite.dev/">目标 D：Vite</a>
      <a href="https://www.typescriptlang.org/">目标 E：TypeScript</a>
    </section>
  </main>
</body>
</html>
